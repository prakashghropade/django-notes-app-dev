apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-deployment
  app: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-app
          image: prakashghorpade2001/notes-app-k8s:latest
          ports:
            - containerPort: 8000